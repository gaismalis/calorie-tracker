<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Calorie Tracker app icon: plate with fork and knife on the app's accent green.
       Full-bleed square (platforms round the corners themselves); the drawing stays inside the
       central 60 % so it survives Android's circular/squircle masks. -->
  <rect width="512" height="512" fill="#2f855a"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#ffffff" stroke-width="20"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.55"/>
  <!-- fork -->
  <g fill="#ffffff" transform="translate(-12 0)">
    <rect x="124" y="160" width="9" height="62" rx="4.5"/>
    <rect x="142" y="160" width="9" height="62" rx="4.5"/>
    <rect x="106" y="160" width="9" height="62" rx="4.5"/>
    <path d="M106 214 h45 v12 a22.5 22.5 0 0 1 -14 21 v105 a8.5 8.5 0 0 1 -17 0 v-105 a22.5 22.5 0 0 1 -14 -21 z"/>
  </g>
  <!-- knife -->
  <path fill="#ffffff" transform="translate(12 0)" d="M392 160 c-22 18 -28 58 -26 100 h18 v92 a8.5 8.5 0 0 0 17 0 v-187 a5 5 0 0 0 -9 -5 z"/>
</svg>
