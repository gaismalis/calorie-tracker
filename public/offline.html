<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f855a">
    <title>Offline · Calorie Tracker</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f7f4;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; text-align: center; padding: 1.5rem; box-sizing: border-box; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
        p { color: #6b6b6b; margin: 0 0 1.25rem; }
        button { font: inherit; color: #fff; background: #2f855a; border: 0; border-radius: 6px; padding: 0.6rem 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Calorie Tracker needs a connection to save entries and estimate calories.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
